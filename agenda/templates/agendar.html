<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendar Consulta - MedAgenda</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                🏥 MedAgenda
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'consultas' %}">
                            Consultas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'pacientes' %}">
                            Pacientes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'medicos' %}">
                            Médicos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contato' %}">
                            Contato
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- TÍTULO -->
                <div class="text-center mb-4">

                    <h1 class="fw-bold text-primary">
                        📅 Agendar Consulta
                    </h1>

                    <p class="text-secondary">
                        Preencha os dados abaixo para realizar
                        um novo agendamento.
                    </p>

                </div>


                <!-- FORMULÁRIO -->
                <div class="card shadow-sm border-0">

                    <div class="card-body p-4">

                        <form method="POST">

                            {% csrf_token %}

                            <!-- PACIENTE -->
                            <div class="mb-3">

                                <label for="paciente" class="form-label fw-bold">
                                    Paciente
                                </label>

                                <select
                                    class="form-select"
                                    id="paciente"
                                    name="paciente"
                                    required>

                                    <option value="" selected disabled>
                                        Selecione o paciente
                                    </option>

                                    <option value="joao">
                                        João Silva
                                    </option>

                                    <option value="ana">
                                        Ana Souza
                                    </option>

                                    <option value="pedro">
                                        Pedro Lima
                                    </option>

                                </select>

                            </div>


                            <!-- MÉDICO -->
                            <div class="mb-3">

                                <label for="medico" class="form-label fw-bold">
                                    Médico
                                </label>

                                <select
                                    class="form-select"
                                    id="medico"
                                    name="medico"
                                    required>

                                    <option value="" selected disabled>
                                        Selecione o médico
                                    </option>

                                    <option value="maria">
                                        Dra. Maria
                                    </option>

                                    <option value="carlos">
                                        Dr. Carlos
                                    </option>

                                    <option value="fernanda">
                                        Dra. Fernanda
                                    </option>

                                </select>

                            </div>


                            <!-- DATA -->
                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="data" class="form-label fw-bold">
                                        Data da Consulta
                                    </label>

                                    <input
                                        type="date"
                                        class="form-control"
                                        id="data"
                                        name="data"
                                        required>

                                </div>


                                <!-- HORÁRIO -->
                                <div class="col-md-6 mb-3">

                                    <label for="horario" class="form-label fw-bold">
                                        Horário
                                    </label>

                                    <input
                                        type="time"
                                        class="form-control"
                                        id="horario"
                                        name="horario"
                                        required>

                                </div>

                            </div>


                            <!-- MOTIVO -->
                            <div class="mb-3">

                                <label for="motivo" class="form-label fw-bold">
                                    Motivo da Consulta
                                </label>

                                <textarea
                                    class="form-control"
                                    id="motivo"
                                    name="motivo"
                                    rows="4"
                                    placeholder="Descreva brevemente o motivo da consulta..."
                                    required></textarea>

                            </div>


                            <!-- OBSERVAÇÕES -->
                            <div class="mb-4">

                                <label for="observacoes" class="form-label fw-bold">
                                    Observações
                                </label>

                                <textarea
                                    class="form-control"
                                    id="observacoes"
                                    name="observacoes"
                                    rows="3"
                                    placeholder="Alguma observação adicional?"></textarea>

                            </div>


                            <!-- BOTÕES -->
                            <div class="d-flex justify-content-between">

                                <a
                                    href="{% url 'home' %}"
                                    class="btn btn-outline-secondary">

                                    ← Voltar

                                </a>


                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    📅 Confirmar Agendamento

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="bg-primary text-white text-center py-4 mt-5">

        <p class="mb-1 fw-bold">
            🏥 MedAgenda
        </p>

        <p class="mb-0">
            © 2026 MedAgenda - Gestão de consultas médicas.
        </p>

    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
